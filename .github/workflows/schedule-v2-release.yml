name: Publish v2.0 at 2026-08-31 06:00 KST

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/schedule-v2-release.yml"
  schedule:
    - cron: "55 20 30 8 *"

permissions:
  contents: write

jobs:
  update-draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Update v.2.0 notes and keep it draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(cat <<'PATCH_NOTES'
          ### 대동 - 출GO v2.0

          - `.xlsx` 및 `.xlsm` 파일 지원
          - 프로그램 내 품목 정보 관리 기능 추가
          - 라벨 수량을 원본 발주서 K열에 저장
          - 자동 업데이트 안정화 및 EXE 위치 변경 문제 수정
          PATCH_NOTES
          )"
          payload="$(jq -n --arg body "$body" \
            '{draft:true,tag_name:"v.2.0",target_commitish:"main",body:$body}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/378520927" \
            --data "$payload")"
          test "$(jq -r '.draft' <<<"$response")" = "true"
          test "$(jq -r '.tag_name' <<<"$response")" = "v.2.0"
          test "$(jq -r '.body' <<<"$response")" = "$body"

  publish-release:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait until 06:00 KST
        run: |
          set -euo pipefail
          target_epoch="$(date -u -d '2026-08-30T21:00:00Z' +%s)"
          now_epoch="$(date -u +%s)"
          if (( now_epoch > target_epoch + 86400 )); then
            echo "This one-time schedule has expired."
            exit 1
          fi
          if (( now_epoch < target_epoch )); then
            sleep "$((target_epoch - now_epoch))"
          fi

      - name: Publish v.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/378520927" \
            --data '{"draft":false,"tag_name":"v.2.0","target_commitish":"main"}')"
          test "$(jq -r '.draft' <<<"$response")" = "false"
          test "$(jq -r '.tag_name' <<<"$response")" = "v.2.0"

      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/schedule-v2-release.yml"
          file_json="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url?ref=main")"
          file_sha="$(jq -r '.sha' <<<"$file_json")"
          payload="$(jq -n --arg sha "$file_sha" \
            '{message:"Remove completed v2.0 release schedule",sha:$sha,branch:"main"}')"
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url" \
            --data "$payload" >/dev/null
